<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Tracker 👶</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --yellow: #FFE066;
      --yellow-light: #FFF9E0;
      --brown: #8B6914;
      --pink: #F8A4C8;
      --pink-light: #FCE4F0;
      --pink-dark: #E06292;
      --green: #8CE99A;
      --green-light: #EBFBEE;
      --bg: #FEF9F5;
      --text: #4A3347;
      --text-light: #8A7388;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
      --radius: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 30px 20px 20px;
    }

    .header-emoji {
      font-size: 3.5rem;
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin: 8px 0;
    }

    .header p {
      color: var(--text-light);
      font-size: 1rem;
    }

    /* Lactancia Active Banner */
    .lactancia-banner {
      display: none;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
      border-radius: var(--radius);
      padding: 20px 25px;
      margin: 15px 0;
      text-align: center;
      box-shadow: 0 6px 25px rgba(240, 98, 146, 0.35);
      animation: slideDown 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lactancia-banner.active { display: block; }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .lactancia-banner .ban-icon { font-size: 2rem; margin-bottom: 6px; }

    .lactancia-banner .ban-label {
      font-size: 0.85rem;
      opacity: 0.9;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lactancia-banner .ban-timer {
      font-size: 2.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      margin: 6px 0;
    }

    .lactancia-banner .ban-since {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-bottom: 14px;
    }

    .lactancia-banner .ban-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .ban-btn {
      padding: 12px 28px;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .ban-btn-stop {
      background: white;
      color: var(--pink-dark);
    }

    .ban-btn-stop:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }

    .ban-btn-cancel {
      background: rgba(255,255,255,0.25);
      color: white;
      border: 2px solid rgba(255,255,255,0.5);
    }

    .ban-btn-cancel:hover { background: rgba(255,255,255,0.4); }

    .ban-notas-select {
      padding: 10px 16px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.15);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .ban-notas-select::placeholder { color: rgba(255,255,255,0.7); }

    /* Action Buttons */
    .action-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    .action-btn {
      border: none;
      border-radius: 20px;
      padding: 30px 15px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow);
    }

    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .action-btn:active { transform: translateY(0); }

    .action-btn .icon { font-size: 2.5rem; }

    .btn-pipi { background: linear-gradient(135deg, var(--yellow), #FFD700); color: var(--brown); }
    .btn-caca { background: linear-gradient(135deg, #A0522D, #6B3E26); color: white; }
    .btn-lactancia { background: linear-gradient(135deg, var(--pink), var(--pink-dark)); color: white; }

    .action-btn.in-progress {
      animation: pulse-glow 1.5s ease-in-out infinite;
      box-shadow: 0 0 0 0 rgba(248, 164, 200, 0.5);
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 4px 20px rgba(248, 164, 200, 0.3); }
      50% { box-shadow: 0 4px 30px rgba(248, 164, 200, 0.6); }
    }

    /* Summary Cards */
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .summary-card {
      background: var(--white);
      border-radius: 16px;
      padding: 18px 12px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .summary-card .sum-icon { font-size: 1.6rem; margin-bottom: 4px; }
    .summary-card .sum-value { font-size: 1.6rem; font-weight: 800; }
    .summary-card .sum-label { font-size: 0.75rem; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-card.pipi .sum-value { color: #B8860B; }
    .summary-card.caca .sum-value { color: #6B3E26; }
    .summary-card.lactancia .sum-value { color: var(--pink-dark); }

    /* Chart */
    .chart-section {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 25px;
      margin: 20px 0;
    }

    .chart-section h2 { font-size: 1.2rem; text-align: center; margin-bottom: 15px; }

    .chart-tabs { display: flex; gap: 8px; margin-bottom: 15px; }

    .chart-tab {
      flex: 1;
      padding: 8px;
      border: 2px solid var(--yellow-light);
      border-radius: 10px;
      background: var(--white);
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chart-tab:hover { background: var(--yellow-light); }
    .chart-tab.active { background: var(--yellow); border-color: var(--yellow); }

    /* Log Section */
    .log-section {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 25px;
      margin: 20px 0;
    }

    .log-section h2 { font-size: 1.2rem; text-align: center; margin-bottom: 15px; }

    .log-entry {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 8px;
      background: var(--bg);
      transition: background 0.2s;
    }

    .log-entry:hover { background: var(--yellow-light); }

    .log-entry .type-icon { font-size: 1.5rem; flex-shrink: 0; }
    .log-entry .log-info { flex: 1; }
    .log-entry .log-time { font-weight: 700; font-size: 0.95rem; }
    .log-entry .log-detail { font-size: 0.8rem; color: var(--text-light); }

    .log-entry .edit-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .log-entry .edit-btn:hover { background: var(--yellow-light); }

    .no-log { text-align: center; padding: 30px; color: var(--text-light); font-size: 0.95rem; }

    /* Quick Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(74, 51, 71, 0.5);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--white);
      border-radius: var(--radius);
      padding: 35px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      animation: modalIn 0.3s ease-out;
    }

    @keyframes modalIn {
      from { transform: scale(0.9) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal .modal-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .modal h3 { font-size: 1.4rem; margin-bottom: 8px; }
    .modal p { color: var(--text-light); margin-bottom: 5px; font-size: 0.9rem; }

    .modal-form { margin: 20px 0; text-align: left; }

    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }

    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--yellow-light);
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group select:focus { border-color: var(--yellow); }

    .btn-save {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--yellow), #FFD700);
      color: var(--brown);
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255, 200, 0, 0.3);
    }

    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 200, 0, 0.4); }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-cancel {
      background: none;
      border: none;
      color: var(--text-light);
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-cancel:hover { color: var(--text); }

    /* Edit Modal */
    .btn-delete {
      background: none;
      border: 2px solid #ff6b6b;
      color: #ff6b6b;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 16px;
      margin-top: 12px;
      transition: all 0.2s;
    }

    .btn-delete:hover { background: #ff6b6b; color: white; }

    .delete-confirm {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #FFF5F5;
      border-radius: 12px;
      border: 2px solid #ff6b6b;
    }

    .delete-confirm p { color: var(--text); font-size: 0.9rem; margin-bottom: 10px; }

    .delete-confirm-btns { display: flex; gap: 10px; }

    .delete-confirm-btns button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .delete-confirm-btns .btn-yes { background: #ff6b6b; color: white; }
    .delete-confirm-btns .btn-no { background: var(--yellow-light); color: var(--text); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: white;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 200;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(0,0,0,0.15);
      border-top-color: var(--brown);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { text-align: center; padding: 20px; color: var(--text-light); font-size: 0.8rem; }

    /* Responsive */
    @media (max-width: 500px) {
      .action-buttons { grid-template-columns: 1fr; }
      .summary-bar { grid-template-columns: 1fr; }
      .header h1 { font-size: 1.6rem; }
      .lactancia-banner .ban-timer { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <header class="header">
    <div class="header-emoji">👶</div>
    <h1>Baby Tracker</h1>
    <p id="todayLabel"></p>
  </header>

  <!-- Lactancia Active Banner -->
  <div class="lactancia-banner" id="lactanciaBanner">
    <div class="ban-icon">🍼</div>
    <div class="ban-label">Lactancia en curso</div>
    <div class="ban-timer" id="banTimer">00:00</div>
    <div class="ban-since" id="banSince">desde las --:--</div>
    <div class="ban-actions">
      <input type="text" class="ban-notas-select" id="banNotas" placeholder="Notas (opcional)" style="padding: 10px 16px;border-radius: 50px;border: 2px solid rgba(255,255,255,0.5);background: rgba(255,255,255,0.15);color: white;font-family: 'Nunito', sans-serif;font-size: 0.9rem;font-weight: 600;outline: none;width: 160px;">
      <button class="ban-btn ban-btn-stop" id="banStopBtn" onclick="stopLactancia()">⏹ Detener</button>
      <button class="ban-btn ban-btn-cancel" onclick="cancelLactancia()">✕ Cancelar</button>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="action-buttons">
    <button class="action-btn btn-pipi" onclick="openQuickModal('pipi')">
      <span class="icon">💧</span>
      Pipí
    </button>
    <button class="action-btn btn-caca" onclick="openQuickModal('caca')">
      <span class="icon">💩</span>
      Caca
    </button>
    <button class="action-btn btn-lactancia" id="btnLactancia" onclick="startLactancia()">
      <span class="icon">🍼</span>
      Lactancia
    </button>
  </div>

  <!-- Summary Cards -->
  <div class="summary-bar">
    <div class="summary-card pipi">
      <div class="sum-icon">💧</div>
      <div class="sum-value" id="todayPipi">0</div>
      <div class="sum-label">Pipís hoy</div>
    </div>
    <div class="summary-card caca">
      <div class="sum-icon">💩</div>
      <div class="sum-value" id="todayCaca">0</div>
      <div class="sum-label">Cacas hoy</div>
    </div>
    <div class="summary-card lactancia">
      <div class="sum-icon">🍼</div>
      <div class="sum-value" id="todayLactancia">0</div>
      <div class="sum-label">Lactancias hoy</div>
    </div>
  </div>

  <!-- Chart -->
  <section class="chart-section">
    <h2>📈 Evolución (últimos 7 días)</h2>
    <div class="chart-tabs">
      <button class="chart-tab active" onclick="setChartType('all')">Todos</button>
      <button class="chart-tab" onclick="setChartType('pipi')">💧 Pipí</button>
      <button class="chart-tab" onclick="setChartType('caca')">💩 Caca</button>
      <button class="chart-tab" onclick="setChartType('lactancia')">🍼 Lactancia</button>
    </div>
    <canvas id="chart" height="220"></canvas>
  </section>

  <!-- Recent Log -->
  <section class="log-section">
    <h2>🕐 Últimos registros</h2>
    <div id="logContainer">
      <div class="no-log">Cargando...</div>
    </div>
  </section>

  <footer class="footer">
    Hecho con 💕 · 2026
  </footer>
</div>

<!-- Quick Modal (pipi / caca) -->
<div class="modal-overlay" id="quickModal">
  <div class="modal">
    <div class="modal-icon" id="quickIcon">💧</div>
    <h3 id="quickTitle">Registrar Pipí</h3>
    <p id="quickTime"></p>
    <div class="modal-form">
      <div class="form-group">
        <label>📌 Notas (opcional)</label>
        <input type="text" id="quickNotasInput" placeholder="Ej: biberón, izquierda..." style="width:100%;padding:12px 14px;border:2px solid var(--yellow-light);border-radius:12px;font-family:'Nunito',sans-serif;font-size:1rem;outline:none;">
      </div>
    </div>
    <button class="btn-save" id="quickSaveBtn" onclick="saveQuick()">Guardar</button>
    <button class="btn-cancel" onclick="closeQuickModal()">Cancelar</button>
    <input type="hidden" id="quickType">
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-icon" id="editIcon">📝</div>
    <h3>Editar registro</h3>
    <p id="editTime"></p>
    <div class="modal-form" id="editFormContent"></div>
    <button class="btn-save" id="editSaveBtn" onclick="saveEdit()">Guardar cambios</button>
    <button class="btn-delete" onclick="showDeleteConfirm()">🗑 Eliminar</button>
    <button class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
    <div class="delete-confirm" id="deleteConfirm">
      <p>¿Eliminar este registro?</p>
      <div class="delete-confirm-btns">
        <button class="btn-no" onclick="hideDeleteConfirm()">No</button>
        <button class="btn-yes" onclick="confirmDelete()">Sí, eliminar</button>
      </div>
    </div>
    <input type="hidden" id="editingRowId">
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ================================================================
// CONFIG
// ================================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbwLEvJNV-ordsggRrv_MaSp3HKNpJwB5oiOI-bUayXumWrg8WjHK21bwyVaYIQHZbUzYw/exec';

const TYPE_ICONS = { pipi: '💧', caca: '💩', lactancia: '🍼' };
const TYPE_LABELS = { pipi: 'Pipí', caca: 'Caca', lactancia: 'Lactancia' };

const SESSION_KEY = 'bt_lactancia_inicio';
let allRecords = [];
let currentChartType = 'all';
let chart = null;
let timerInterval = null;

// Lactancia session state
let sessionInicio = null; // ISO timestamp when lactation started

// ================================================================
// INIT
// ================================================================

document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  document.getElementById('todayLabel').textContent = today.toLocaleDateString('es-ES', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

  // Restore persisted lactation session
  const saved = localStorage.getItem(SESSION_KEY);
  if (saved) {
    sessionInicio = saved;
    const startTime = new Date(sessionInicio);
    document.getElementById('lactanciaBanner').classList.add('active');
    document.getElementById('btnLactancia').classList.add('in-progress');
    document.getElementById('banSince').textContent = 'desde las ' + timeFormat(startTime);
    document.getElementById('banTimer').textContent = '00:00';
    document.getElementById('banNotas').value = '';
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateBanTimer, 1000);
  }

  loadRecords();
  setInterval(loadRecords, 30000);
});

// ================================================================
// LACTANCIA SESSION
// ================================================================

function startLactancia() {
  if (sessionInicio) return; // already in progress

  sessionInicio = new Date().toISOString();
  const startTime = new Date(sessionInicio);

  // Persist to localStorage
  localStorage.setItem(SESSION_KEY, sessionInicio);

  // Show banner
  document.getElementById('lactanciaBanner').classList.add('active');
  document.getElementById('btnLactancia').classList.add('in-progress');
  document.getElementById('banSince').textContent = 'desde las ' + timeFormat(startTime);
  document.getElementById('banTimer').textContent = '00:00';
  document.getElementById('banNotas').value = '';

  // Start live timer
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateBanTimer, 1000);
}

function updateBanTimer() {
  if (!sessionInicio) return;
  const elapsed = Math.floor((Date.now() - new Date(sessionInicio).getTime()) / 1000);
  const h = Math.floor(elapsed / 3600);
  const m = Math.floor((elapsed % 3600) / 60);
  const s = elapsed % 60;
  document.getElementById('banTimer').textContent =
    (h > 0 ? String(h).padStart(2, '0') + ':' : '') +
    String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

async function stopLactancia() {
  if (!sessionInicio) return;

  const fin = new Date();
  const inicio = new Date(sessionInicio);
  const diff = Math.round((fin - inicio) / 60000); // minutes
  const notas = document.getElementById('banNotas').value;

  clearInterval(timerInterval);
  timerInterval = null;
  sessionInicio = null;
  localStorage.removeItem(SESSION_KEY);

  // Hide banner
  document.getElementById('lactanciaBanner').classList.remove('active');
  document.getElementById('btnLactancia').classList.remove('in-progress');

  // Save
  try {
    await logEvent('lactancia', Math.max(1, diff), notas);
    showToast('🍼 Lactancia registrada (' + diff + ' min)');
    await loadRecords();
  } catch (e) {
    showToast('❌ Error: ' + e.message);
  }
}

function cancelLactancia() {
  clearInterval(timerInterval);
  timerInterval = null;
  sessionInicio = null;
  localStorage.removeItem(SESSION_KEY);
  document.getElementById('lactanciaBanner').classList.remove('active');
  document.getElementById('btnLactancia').classList.remove('in-progress');
  showToast('Lactancia cancelada');
}

function timeFormat(d) {
  return d.toTimeString().substring(0, 5);
}

function toDatetimeLocal(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ================================================================
// API
// ================================================================

async function loadRecords() {
  try {
    const resp = await fetch(`${API_URL}?action=getRecords`);
    const data = await resp.json();
    allRecords = data.records || [];
    renderTodaySummary();
    renderLog();
    renderChart();
  } catch (e) {
    console.warn('Could not load records:', e);
    document.getElementById('logContainer').innerHTML =
      '<div class="no-log">No se pudieron cargar los registros.</div>';
  }
}

async function logEvent(type, duracionMin, notas) {
  const body = { action: 'logEvent', type, duracion_min: duracionMin, notas };
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const result = await resp.json();
  if (!result.success) throw new Error(result.error);
  return result;
}

async function updateRecord(rowId, type, duracionMin, notas, timestamp) {
  const body = { action: 'updateRecord', row_id: rowId, type, duracion_min: duracionMin, notas, timestamp };
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const result = await resp.json();
  if (!result.success) throw new Error(result.error);
  return result;
}

async function deleteRecord(rowId) {
  const body = { action: 'deleteRecord', row_id: rowId };
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const result = await resp.json();
  if (!result.success) throw new Error(result.error);
  return result;
}

// ================================================================
// RENDER
// ================================================================

function renderTodaySummary() {
  const today = new Date().toISOString().split('T')[0];
  const todayRecords = allRecords.filter(r => r.timestamp.startsWith(today));
  document.getElementById('todayPipi').textContent = todayRecords.filter(r => r.type === 'pipi').length;
  document.getElementById('todayCaca').textContent = todayRecords.filter(r => r.type === 'caca').length;
  document.getElementById('todayLactancia').textContent = todayRecords.filter(r => r.type === 'lactancia').length;
}

function renderLog() {
  const container = document.getElementById('logContainer');
  const recent = allRecords.slice(0, 20);

  if (recent.length === 0) {
    container.innerHTML = '<div class="no-log">Sin registros todavía. ¡Vamos!</div>';
    return;
  }

  container.innerHTML = recent.map(r => {
    const icon = TYPE_ICONS[r.type] || '📝';
    const time = formatTimestamp(r.timestamp);
    let detail = r.notas ? `· ${r.notas}` : '';
    if (r.type === 'lactancia' && r.duracion_min) {
      detail = `· ${r.duracion_min} min ${detail}`;
    }

    return `
      <div class="log-entry">
        <div class="type-icon">${icon}</div>
        <div class="log-info">
          <div class="log-time">${time}</div>
          <div class="log-detail">${TYPE_LABELS[r.type] || r.type} ${detail}</div>
        </div>
        <button class="edit-btn" onclick="openEditModal('${r.row_id}')">✏️</button>
      </div>
    `;
  }).join('');
}

function formatTimestamp(ts) {
  const d = new Date(ts);
  if (isNaN(d.getTime())) return ts; // fallback to raw value
  return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) +
    ' · ' + d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

// ================================================================
// CHART
// ================================================================

function setChartType(type) {
  currentChartType = type;
  document.querySelectorAll('.chart-tab').forEach((t, i) => {
    const types = ['all', 'pipi', 'caca', 'lactancia'];
    t.classList.toggle('active', types[i] === type);
  });
  renderChart();
}

function renderChart() {
  const ctx = document.getElementById('chart').getContext('2d');
  const days = getLast7Days();
  const labels = days.map(d => {
    const dt = new Date(d + 'T12:00:00');
    return dt.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' });
  });

  const pipi = days.map(d => allRecords.filter(r => r.timestamp.startsWith(d) && r.type === 'pipi').length);
  const caca = days.map(d => allRecords.filter(r => r.timestamp.startsWith(d) && r.type === 'caca').length);
  const lact = days.map(d => allRecords.filter(r => r.timestamp.startsWith(d) && r.type === 'lactancia').length);

  let datasets = [];
  if (currentChartType === 'all') {
    datasets = [
      { label: '💧 Pipí', data: pipi, borderColor: 'rgba(255,200,0,1)', backgroundColor: 'rgba(255,200,0,0.7)', pointRadius: 5, pointHoverRadius: 7, tension: 0, fill: false, borderWidth: 2.5 },
      { label: '💩 Caca', data: caca, borderColor: 'rgba(160,82,45,1)', backgroundColor: 'rgba(160,82,45,0.7)', pointRadius: 5, pointHoverRadius: 7, tension: 0, fill: false, borderWidth: 2.5 },
      { label: '🍼 Lactancia', data: lact, borderColor: 'rgba(248,164,200,1)', backgroundColor: 'rgba(248,164,200,0.7)', pointRadius: 5, pointHoverRadius: 7, tension: 0, fill: false, borderWidth: 2.5 }
    ];
  } else if (currentChartType === 'pipi') {
    datasets = [{ label: '💧 Pipí', data: pipi, borderColor: 'rgba(255,200,0,1)', backgroundColor: 'rgba(255,200,0,0.7)', pointRadius: 5, pointHoverRadius: 7, tension: 0, fill: false, borderWidth: 2.5 }];
  } else if (currentChartType === 'caca') {
    datasets = [{ label: '💩 Caca', data: caca, borderColor: 'rgba(160,82,45,1)', backgroundColor: 'rgba(160,82,45,0.7)', pointRadius: 5, pointHoverRadius: 7, tension: 0, fill: false, borderWidth: 2.5 }];
  } else {
    datasets = [{ label: '🍼 Lactancia', data: lact, borderColor: 'rgba(248,164,200,1)', backgroundColor: 'rgba(248,164,200,0.7)', pointRadius: 5, pointHoverRadius: 7, tension: 0, fill: false, borderWidth: 2.5 }];
  }

  // Ensure all data is valid numbers (defensive)
  const safeData = arr => arr.map(v => (typeof v === 'number' && !isNaN(v) ? v : 0));

  if (chart) chart.destroy();
  try {
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: datasets.map(ds => ({ ...ds, data: safeData(ds.data) }))
      },
      options: {
        responsive: true,
        animation: false,
        plugins: {
          legend: { display: currentChartType === 'all', labels: { font: { family: 'Nunito', size: 13 } } }
        },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1, font: { family: 'Nunito' } } },
          x: { grid: { display: false }, ticks: { font: { family: 'Nunito', size: 12 } } }
        }
      }
    });
  } catch (e) {
    console.warn('Chart render error:', e);
  }
}

function getLast7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().split('T')[0]);
  }
  return days;
}

// ================================================================
// QUICK MODAL (pipi / caca)
// ================================================================

function openQuickModal(type) {
  const now = new Date();
  document.getElementById('quickType').value = type;
  document.getElementById('quickNotasInput').value = '';
  document.getElementById('quickTime').textContent = 'Hora: ' + timeFormat(now);
  document.getElementById('quickIcon').textContent = TYPE_ICONS[type] || '📝';
  document.getElementById('quickTitle').textContent = 'Registrar ' + TYPE_LABELS[type];
  document.getElementById('quickSaveBtn').textContent = 'Guardar';
  document.getElementById('quickSaveBtn').disabled = false;
  document.getElementById('quickModal').classList.add('active');
}

function closeQuickModal() {
  document.getElementById('quickModal').classList.remove('active');
}

async function saveQuick() {
  const type = document.getElementById('quickType').value;
  const notas = document.getElementById('quickNotasInput').value;
  const btn = document.getElementById('quickSaveBtn');
  btn.disabled = true;
  btn.textContent = '';

  try {
    await logEvent(type, null, notas);
    closeQuickModal();
    showToast(TYPE_ICONS[type] + ' ' + TYPE_LABELS[type] + ' registrada');
    await loadRecords();
  } catch (e) {
    showToast('❌ Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
}

// ================================================================
// EDIT MODAL
// ================================================================

function openEditModal(rowId) {
  const r = allRecords.find(x => x.row_id === rowId);
  if (!r) return;

  document.getElementById('editingRowId').value = rowId;
  document.getElementById('editIcon').textContent = TYPE_ICONS[r.type] || '📝';
  document.getElementById('editTime').textContent = formatTimestamp(r.timestamp);
  document.getElementById('deleteConfirm').style.display = 'none';

  let formHtml = '';
  if (r.type === 'lactancia') {
    formHtml = `
      <div class="form-group">
        <label>🕐 Fecha y hora del registro</label>
        <input type="datetime-local" id="editTimestamp" style="width:100%;padding:12px 14px;border:2px solid var(--yellow-light);border-radius:12px;font-family:'Nunito',sans-serif;font-size:1rem;outline:none;">
      </div>
      <div class="form-group">
        <label>⏱ Duración (minutos)</label>
        <input type="number" id="editDuracion" min="1" value="${r.duracion_min || ''}" style="width:100%;padding:12px 14px;border:2px solid var(--yellow-light);border-radius:12px;font-family:'Nunito',sans-serif;font-size:1rem;outline:none;">
      </div>
      <div class="form-group">
        <label>📌 Notas</label>
        <input type="text" id="editNotas" placeholder="Notas (opcional)" style="width:100%;padding:12px 14px;border:2px solid var(--yellow-light);border-radius:12px;font-family:'Nunito',sans-serif;font-size:1rem;outline:none;">
      </div>
    `;
    setTimeout(() => {
      document.getElementById('editNotas').value = r.notas || '';
      const d = new Date(r.timestamp);
      document.getElementById('editTimestamp').value = toDatetimeLocal(d);
    }, 50);
  } else {
    formHtml = `
      <div class="form-group">
        <label>🕐 Fecha y hora del registro</label>
        <input type="datetime-local" id="editTimestamp" style="width:100%;padding:12px 14px;border:2px solid var(--yellow-light);border-radius:12px;font-family:'Nunito',sans-serif;font-size:1rem;outline:none;">
      </div>
      <div class="form-group">
        <label>📌 Notas</label>
        <input type="text" id="editNotas" placeholder="Notas (opcional)" style="width:100%;padding:12px 14px;border:2px solid var(--yellow-light);border-radius:12px;font-family:'Nunito',sans-serif;font-size:1rem;outline:none;">
      </div>
    `;
    setTimeout(() => {
      document.getElementById('editNotas').value = r.notas || '';
      const d = new Date(r.timestamp);
      document.getElementById('editTimestamp').value = toDatetimeLocal(d);
    }, 50);
  }

  document.getElementById('editFormContent').innerHTML = formHtml;
  document.getElementById('editModal').classList.add('active');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('active');
}

function showDeleteConfirm() {
  document.getElementById('deleteConfirm').style.display = 'block';
}

function hideDeleteConfirm() {
  document.getElementById('deleteConfirm').style.display = 'none';
}

async function saveEdit() {
  const rowId = document.getElementById('editingRowId').value;
  const r = allRecords.find(x => x.row_id === rowId);
  if (!r) return;

  const btn = document.getElementById('editSaveBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const tsInput = document.getElementById('editTimestamp')?.value;
  let newTimestamp = r.timestamp;
  if (tsInput) {
    const parsed = new Date(tsInput);
    if (!isNaN(parsed.getTime())) newTimestamp = parsed.toISOString();
  }

  try {
    if (r.type === 'lactancia') {
      const duracion = parseInt(document.getElementById('editDuracion')?.value) || 1;
      const notas = document.getElementById('editNotas')?.value || '';
      await updateRecord(rowId, 'lactancia', duracion, notas, newTimestamp);
    } else {
      const notas = document.getElementById('editNotas')?.value || '';
      await updateRecord(rowId, r.type, null, notas, newTimestamp);
    }
    closeEditModal();
    showToast('✅ Registro actualizado');
    await loadRecords();
  } catch (e) {
    showToast('❌ Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Guardar cambios';
  }
}

async function confirmDelete() {
  const rowId = document.getElementById('editingRowId').value;
  try {
    await deleteRecord(rowId);
    closeEditModal();
    showToast('🗑 Registro eliminado');
    await loadRecords();
  } catch (e) {
    showToast('❌ Error: ' + e.message);
  }
}

// ================================================================
// TOAST
// ================================================================

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
